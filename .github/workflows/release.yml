name: Verify and publish lifecycle release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Prepare isolated payload test dependencies
        run: |
          command -v bwrap
          # Payload isolation uses /usr/bin/python3; install its pure Python
          # dependencies through the same PyPI route as the source gate.
          sudo "$(command -v python)" -m pip install --no-deps --target /usr/lib/python3/dist-packages kconfiglib==14.1.0 tomlkit==0.13.3
          /usr/bin/python3 -c 'import kconfiglib, tomlkit, yaml'
      - name: Verify source
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install kconfiglib tomlkit PyYAML
          bash -n bootstrap.sh
          test_home="$(mktemp -d)"
          trap 'rm -rf -- "$test_home"' EXIT
          env -i HOME="$test_home" PATH="$PATH" LANG=C.UTF-8 CODEX_HOME="$test_home/codex" XDG_CONFIG_HOME="$test_home/config" XDG_STATE_HOME="$test_home/state" XDG_DATA_HOME="$test_home/data" XDG_CACHE_HOME="$test_home/cache" "$PWD/.venv/bin/python" -m unittest discover -s tests -v
          git diff --check
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Build runtime assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pennix-lifecycle
          scripts/build-release.sh "${version}" HEAD "${GITHUB_WORKSPACE}/dist/pennix-lifecycle-${version}.tar.gz"
          (cd dist && sha256sum "pennix-lifecycle-${version}.tar.gz" > "pennix-lifecycle-${version}.tar.gz.sha256")
          cp bootstrap.sh dist/bootstrap.sh
      - name: Verify actual runtime payload
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf -- "$test_home"' EXIT
          env -i HOME="$test_home" PATH="$PATH" LANG=C.UTF-8 CODEX_HOME="$test_home/codex" XDG_CONFIG_HOME="$test_home/config" XDG_STATE_HOME="$test_home/state" XDG_DATA_HOME="$test_home/data" XDG_CACHE_HOME="$test_home/cache" PENNIX_TEST_RELEASE_ARCHIVE="$PWD/dist/pennix-lifecycle-${GITHUB_REF_NAME#v}.tar.gz" "$PWD/.venv/bin/python" -m unittest discover -s tests -p test_release_payload.py -v
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" dist/bootstrap.sh "dist/pennix-lifecycle-${version}.tar.gz" "dist/pennix-lifecycle-${version}.tar.gz.sha256" --title "${GITHUB_REF_NAME}" --generate-notes
