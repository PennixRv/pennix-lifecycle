name: Verify and publish lifecycle release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify source
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install kconfiglib tomlkit PyYAML
          bash -n bootstrap.sh
          python -m unittest discover -s tests -v
          git diff --check
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Build runtime assets
        run: |
          mkdir -p dist/pennix-lifecycle
          cp -a pennix scripts references config templates VERSION dist/pennix-lifecycle/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -type f -name '*.pyc' -delete
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf dist/pennix-lifecycle.tar.gz -C dist pennix-lifecycle
          (cd dist && sha256sum pennix-lifecycle.tar.gz > pennix-lifecycle.tar.gz.sha256)
          cp bootstrap.sh dist/bootstrap.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/bootstrap.sh dist/pennix-lifecycle.tar.gz dist/pennix-lifecycle.tar.gz.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/bootstrap.sh dist/pennix-lifecycle.tar.gz dist/pennix-lifecycle.tar.gz.sha256 --title "${GITHUB_REF_NAME}" --generate-notes
          fi
